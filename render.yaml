services:
  - type: web
    name: world-cup-prediction-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: SECRET_KEY
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAILS
        value: ian@test.com
      - key: SEED_USERS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: world-cup-prediction-db
          property: connectionString

databases:
  - name: world-cup-prediction-db
    databaseName: world_cup_prediction
    user: world_cup_prediction
    plan: basic-256mb
